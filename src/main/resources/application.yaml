spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bzrpersona
    username: postgres
    password: postgres
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  jpa:
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/bazar-realm
server:
  servlet:
    context-path: /api
  port: 8081

logging:
  level:
    org:
      springframework:
        security: trace
