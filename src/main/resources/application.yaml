spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bzrpersona}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  jpa:
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_URL:http://localhost:9999/realms/bazar-realm}
          jwk-set-uri: ${KC_URL:http://localhost:9999/realms/bazar-realm}/protocol/openid-connect/certs
server:
  servlet:
    context-path: /api
  port: 8080
management:
  server:
    port: 8090
logging:
  level:
    org:
      bazar: ${LOGGING_LEVEL:debug}
