spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  jpa:
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_EXTERNAL_URL}/realms/${KC_REALM}
          jwk-set-uri: ${KC_URL}/realms/${KC_REALM}/protocol/openid-connect/certs
server:
  servlet:
    context-path: /api
  port: 8080
management:
  server:
    port: 8090
logging:
  level:
    org:
      bazar: ${LOGGING_LEVEL}
