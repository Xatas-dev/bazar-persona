name: CI/CD Pipeline - bazar-persona

permissions:
  actions: read
  contents: write
  packages: read

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bazar-persona

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["push", "pull_request", "workflow_dispatch"]'

  build:
    name: Build & Test
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version\s*=' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build bootJar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew bootJar --no-daemon

      - name: Normalize jar name
        run: |
          cp build/libs/bazar-persona-*.jar build/libs/application.jar
          ls -lh build/libs/application.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/application.jar
          retention-days: 1

  # ---------- Code scanning runs in parallel with build ----------
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ---------- Docker: package only, no build ----------
  publish:
    needs: [pre_job, build]
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ needs.build.outputs.app-version }}
    if: |
      needs.pre_job.outputs.should_skip != 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Determine tags and push flag
        id: docker_pre_job
        run: |
          PUSH="false"; TAGS=""
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref_name }}" == release/* ]]; then
              TAGS="${{ env.IMAGE_NAME }}:${{ needs.build.outputs.app-version }},${{ env.IMAGE_NAME }}:latest"
              PUSH="true"
            elif [[ "${{ github.ref_name }}" == "master" ]]; then
              TAGS="${{ env.IMAGE_NAME }}:${{ needs.build.outputs.app-version }}-SNAPSHOT"
              PUSH="true"
            fi
          fi
          {
            echo "PUSH_DOCKER_IMAGE=$PUSH"
            echo "TAGS=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Push=$PUSH Tags=$TAGS"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.docker_pre_job.outputs.PUSH_DOCKER_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.docker_pre_job.outputs.PUSH_DOCKER_IMAGE == 'true' }}
          load:  ${{ steps.docker_pre_job.outputs.PUSH_DOCKER_IMAGE != 'true' }}
          tags:  ${{ steps.docker_pre_job.outputs.TAGS }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  create-tag:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - name: Create or Update Git Tag
        run: |
          TAG_NAME="bpersona-${{ needs.docker-build-and-publish.outputs.app-version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG_NAME" -m "Auto-tag release $TAG_NAME"
          git push origin -f "$TAG_NAME"